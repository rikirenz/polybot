[project]
name = "polybot"
version = "0.1.0"
description = "Classification model for identifying profitable Polymarket trading strategies"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "validation: Data validation tests",
]
addopts = "-v --tb=short"
