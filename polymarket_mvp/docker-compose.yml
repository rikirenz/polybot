services:
  strategy:
    build: .
    container_name: polymarket-mvp
    volumes:
      - ./output:/app/output
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - POLYMARKET_MARKET_SLUG=
      - POLYMARKET_MARKET_SLUGS=
      - POLYMARKET_MAX_TRADES=5000
      - POLYMARKET_MIN_ROWS=200
      - ALLOW_SIMULATED_FALLBACK=false
